<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gestão Agro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f2f1e8;
    --surface: #ffffff;
    --surface-2: #ebe9dc;
    --border: #d9d5c2;
    --text: #23261e;
    --text-2: #5c6151;
    --text-3: #8a8f7a;
    --accent: #4d6a34;
    --accent-ink: #ffffff;
    --accent-soft: #dde8cd;
    --terra: #a85a2a;
    --terra-soft: #f0ddc9;
    --danger: #a13b3b;
    --danger-soft: #f2dbdb;
    --st-prospeccao: #4c6b8a;
    --st-prospeccao-soft: #dbe4ec;
    --st-visita: #a3791f;
    --st-visita-soft: #eee4c9;
    --st-negociacao: #7a5ca8;
    --st-negociacao-soft: #e6ddf0;
    --st-cliente: #3f7d45;
    --st-cliente-soft: #dcebdc;
    --st-inviavel: #a13b3b;
    --st-inviavel-soft: #f2dbdb;
    --shadow: 0 1px 2px rgba(30, 32, 20, 0.06), 0 8px 24px -12px rgba(30, 32, 20, 0.18);
    --radius: 14px;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13160f;
      --surface: #1c2016;
      --surface-2: #242a1c;
      --border: #383f2c;
      --text: #ece9da;
      --text-2: #aeb39c;
      --text-3: #7d8270;
      --accent: #8fb35f;
      --accent-ink: #12160b;
      --accent-soft: #2a3320;
      --terra: #e3985e;
      --terra-soft: #3a2a1a;
      --danger: #e07a7a;
      --danger-soft: #3a2222;
      --st-prospeccao: #8fb0d6;
      --st-prospeccao-soft: #22303f;
      --st-visita: #e0bd6a;
      --st-visita-soft: #3b3218;
      --st-negociacao: #c3aee0;
      --st-negociacao-soft: #332a42;
      --st-cliente: #8fd196;
      --st-cliente-soft: #223a26;
      --st-inviavel: #e07a7a;
      --st-inviavel-soft: #3a2222;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13160f;
    --surface: #1c2016;
    --surface-2: #242a1c;
    --border: #383f2c;
    --text: #ece9da;
    --text-2: #aeb39c;
    --text-3: #7d8270;
    --accent: #8fb35f;
    --accent-ink: #12160b;
    --accent-soft: #2a3320;
    --terra: #e3985e;
    --terra-soft: #3a2a1a;
    --danger: #e07a7a;
    --danger-soft: #3a2222;
    --st-prospeccao: #8fb0d6;
    --st-prospeccao-soft: #22303f;
    --st-visita: #e0bd6a;
    --st-visita-soft: #3b3218;
    --st-negociacao: #c3aee0;
    --st-negociacao-soft: #332a42;
    --st-cliente: #8fd196;
    --st-cliente-soft: #223a26;
    --st-inviavel: #e07a7a;
    --st-inviavel-soft: #3a2222;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f2f1e8;
    --surface: #ffffff;
    --surface-2: #ebe9dc;
    --border: #d9d5c2;
    --text: #23261e;
    --text-2: #5c6151;
    --text-3: #8a8f7a;
    --accent: #4d6a34;
    --accent-ink: #ffffff;
    --accent-soft: #dde8cd;
    --terra: #a85a2a;
    --terra-soft: #f0ddc9;
    --danger: #a13b3b;
    --danger-soft: #f2dbdb;
    --st-prospeccao: #4c6b8a;
    --st-prospeccao-soft: #dbe4ec;
    --st-visita: #a3791f;
    --st-visita-soft: #eee4c9;
    --st-negociacao: #7a5ca8;
    --st-negociacao-soft: #e6ddf0;
    --st-cliente: #3f7d45;
    --st-cliente-soft: #dcebdc;
    --st-inviavel: #a13b3b;
    --st-inviavel-soft: #f2dbdb;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
  }

  /* Top bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .app-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 16px 18px 6px;
  }
  .app-brand .brand-leaf {
    font-size: 1.5rem;
    line-height: 1;
    transform: translateY(1px) rotate(-8deg);
  }
  .app-brand .brand-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .app-brand .brand-eyebrow {
    font-family: var(--font-body);
    font-size: 0.64rem;
    font-weight: 700;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .app-brand .brand-name {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.01em;
    color: var(--accent);
    margin-top: 1px;
  }
  .topbar-inner {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 18px 12px;
  }
  .topbar-inner h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .topbar-actions { display: flex; gap: 6px; }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .search-bar { padding: 0 18px 14px; }
  .search-bar input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  .search-bar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 18px 14px;
  }
  .filter-row[hidden] { display: none; }
  .filter-chip {
    flex: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .filter-chip[data-active="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  /* Main content */
  main {
    flex: 1;
    padding: 6px 18px 100px;
  }

  /* Dashboard */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 10px 0 22px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-card .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
  }
  .stat-card .value {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.5rem;
    font-weight: 600;
    margin-top: 4px;
  }
  .stat-card .sub {
    font-size: 0.72rem;
    color: var(--text-3);
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stat-card-action {
    text-align: left;
    width: 100%;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .stat-card-action:hover { border-color: var(--accent); }
  .stat-card-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stat-card-action .label { display: flex; align-items: center; justify-content: space-between; }
  .stat-card-chevron { color: var(--accent); font-size: 0.95rem; }

  .section-title {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 700;
    margin: 22px 0 10px;
  }

  .check-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
  .check-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
  }
  .check-row:last-child { border-bottom: none; }
  .check-row-left { display: flex; align-items: center; gap: 10px; }
  .check-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-3);
  }
  .empty-state .emoji { font-size: 2rem; display: block; margin-bottom: 10px; }
  .empty-state p { margin: 4px 0; font-size: 0.9rem; }

  /* Cards (list items) */
  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .item-card {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    text-align: left;
    width: 100%;
    padding: 0;
  }
  .item-card .stripe { width: 5px; flex: none; }
  .item-card .body { padding: 12px 14px; flex: 1; min-width: 0; }
  .item-card .top-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .item-card .name {
    font-weight: 600;
    font-size: 0.98rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chip {
    flex: none;
    font-size: 0.68rem;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .item-card .meta {
    margin-top: 4px;
    font-size: 0.82rem;
    color: var(--text-2);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
  }
  .item-card .meta span { white-space: nowrap; }
  .priority-flag { color: var(--terra); font-weight: 700; }

  /* Agenda */
  .agenda-card {
    display: flex;
    align-items: stretch;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .agenda-check {
    flex: none;
    width: 46px;
    border: none;
    border-right: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--accent);
    font-size: 1.15rem;
    font-weight: 700;
  }
  .agenda-check.checked { background: var(--st-cliente-soft); color: var(--st-cliente); }
  .agenda-body {
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    text-align: left;
    padding: 12px 14px;
  }
  .agenda-title { font-weight: 600; font-size: 0.98rem; }
  .agenda-title.done { text-decoration: line-through; color: var(--text-3); }
  .agenda-body .meta {
    margin-top: 4px;
    font-size: 0.82rem;
    color: var(--text-2);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
  }
  .agenda-body .meta span { white-space: nowrap; }

  /* FAB */
  .fab {
    position: fixed;
    right: calc(50% - 280px + 18px);
    bottom: 88px;
    height: 52px;
    padding: 0 20px 0 16px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    box-shadow: 0 2px 4px rgba(20, 22, 12, 0.12), 0 10px 24px -8px rgba(20, 22, 12, 0.35);
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .fab:hover { box-shadow: 0 4px 8px rgba(20, 22, 12, 0.16), 0 14px 28px -8px rgba(20, 22, 12, 0.4); }
  .fab:active { transform: scale(0.96); }
  .fab:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .fab-icon {
    width: 22px;
    height: 22px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fab-icon svg { width: 100%; height: 100%; }
  .fab-label { white-space: nowrap; }
  @media (max-width: 559px) {
    .fab { right: 18px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .fab { animation: fab-in 0.22s cubic-bezier(0.2, 0.8, 0.2, 1); }
  }
  @keyframes fab-in {
    from { opacity: 0; transform: translateY(8px) scale(0.94); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Tab bar */
  .tabbar {
    position: sticky;
    bottom: 0;
    z-index: 20;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tab {
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    padding: 7px 2px;
    border-radius: 10px;
    font-size: 0.62rem;
    color: var(--text-3);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    white-space: nowrap;
  }
  .tab .tab-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .tab .tab-icon svg { width: 100%; height: 100%; }
  .tab[data-active="true"] { color: var(--accent); background: var(--accent-soft); }

  /* Bottom sheet */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 17, 10, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 30;
  }
  .sheet-overlay[data-open="true"] { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    box-shadow: var(--shadow);
    z-index: 31;
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex;
    flex-direction: column;
  }
  .sheet[data-open="true"] { transform: translate(-50%, 0); }
  .sheet-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 999px;
    margin: 10px auto 0;
    flex: none;
  }
  #sheetContent { overflow-y: auto; padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px)); }

  .sheet-title {
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 700;
    margin: 4px 0 16px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-3);
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 0.92rem;
    font-weight: 600;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-danger { background: var(--danger-soft); border-color: var(--danger-soft); color: var(--danger); }
  .btn-maps { background: var(--st-prospeccao-soft); border-color: var(--st-prospeccao-soft); color: var(--st-prospeccao); }
  .btn-whatsapp { background: var(--st-cliente-soft); border-color: var(--st-cliente-soft); color: var(--st-cliente); }
  .btn-block { width: 100%; }
  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .quick-actions { margin-top: 14px; }
  .btn[href] { text-decoration: none; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .detail-grid { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 20px; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .detail-row .k { color: var(--text-3); }
  .detail-row .v { text-align: right; font-weight: 500; }
  .obs-block { background: var(--surface-2); border-radius: 10px; padding: 12px; font-size: 0.88rem; color: var(--text-2); margin-top: 4px; white-space: pre-wrap; }

  .foto-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .foto-thumb {
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    display: block;
    flex: none;
  }
  .foto-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto-remove {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: rgba(20, 22, 12, 0.65);
    color: #fff;
    font-size: 0.85rem;
    line-height: 1;
  }

  .about-block { font-size: 0.85rem; color: var(--text-2); line-height: 1.55; }
  .about-block strong { color: var(--text); }

  .param-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .param-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .param-nome { font-weight: 600; font-size: 0.92rem; }
  .param-valor {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.1rem;
    font-weight: 600;
    margin-top: 4px;
  }
  .param-faixa { font-size: 0.78rem; color: var(--text-3); margin-top: 2px; }
  .param-texto { font-size: 0.85rem; color: var(--text-2); margin-top: 6px; line-height: 1.45; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 96px;
    transform: translate(-50%, 12px);
    max-width: calc(100% - 36px);
    background: var(--text);
    color: var(--bg);
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 600;
    text-align: center;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 40;
  }
  .toast[data-show="true"] { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>


<div class="app">
  <header class="topbar">
    <div class="app-brand">
      <span class="brand-leaf" aria-hidden="true">🌱</span>

  function saveState() {

  var state = loadState();

  var ui = {
    tab: "painel",

    sheet: document.getElementById("sheet"),

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toFloat(v) {
    if (v === "" || v === null || v === undefined) return NaN;
    return parseFloat(String(v).trim().replace(",", "."));
  }

  function fmtNum(v) {
    var n = toFloat(v);
    if (isNaN(n)) return "0";
    return n.toLocaleString("pt-BR");
  }

  function fmtCurrency(v) {
    var n = toFloat(v);
    if (isNaN(n)) n = 0;
    return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  function fmtNum1(v) {
    var n = toFloat(v);
    if (isNaN(n)) return "0,0";
    return n.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }

  function numOrNull(v) {
    if (v === "" || v === null || v === undefined) return null;
    var n = toFloat(v);
    return isNaN(n) ? null : n;
  }

  function fmtDateBR(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split("-");
    if (parts.length !== 3) return dateStr;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }

  function levelColor(nivel) {
    if (!nivel) return { bg: "var(--surface-2)", fg: "var(--text-3)" };
    var n = String(nivel).toUpperCase();
    if (n.indexOf("MUITO BAIXO") !== -1 || n.indexOf("MUITO ALTO") !== -1) return { bg: "var(--st-inviavel-soft)", fg: "var(--st-inviavel)" };
    if (n.indexOf("BOM") !== -1 || n.indexOf("AUSENTE") !== -1) return { bg: "var(--st-cliente-soft)", fg: "var(--st-cliente)" };
    if (n.indexOf("BAIXO") !== -1 || n.indexOf("ALTO") !== -1 || n.indexOf("TRAÇOS") !== -1 || n.indexOf("MÉDIO") !== -1) return { bg: "var(--st-visita-soft)", fg: "var(--st-visita)" };
    return { bg: "var(--accent-soft)", fg: "var(--accent)" };
  }

  function gmapsUrl(gps) {
    var coords = String(gps || "").replace(/\s+/g, "");
    if (!coords) return null;
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(coords);
  }

  function whatsappUrl(phone) {
    var digits = String(phone || "").replace(/\D+/g, "");
    if (!digits) return null;
    if (digits.length <= 11) digits = "55" + digits;
    return "https://wa.me/" + digits;
  }

  function gpsButtonHtml(targetInputId) {
    return '<button type="button" class="btn" data-gps-target="' + targetInputId + '" style="margin-top:6px;">📍 Usar minha localização atual</button>';
  }

  function bindGpsButtons(container) {
    Array.prototype.forEach.call(container.querySelectorAll("[data-gps-target]"), function (btn) {
      btn.addEventListener("click", function () {
        if (!navigator.geolocation) {
          showToast("Localização não é suportada neste navegador.");
          return;
        }
        var input = document.getElementById(btn.dataset.gpsTarget);
        var original = btn.textContent;
        btn.textContent = "Obtendo localização...";
        btn.disabled = true;
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            if (input) input.value = pos.coords.latitude.toFixed(6) + "," + pos.coords.longitude.toFixed(6);
            btn.textContent = original;
            btn.disabled = false;
            showToast("Localização salva.");
          },
          function () {
            btn.textContent = original;
            btn.disabled = false;
            showToast("Não foi possível obter a localização. Verifique a permissão do navegador.");
          },
          { enableHighAccuracy: true, timeout: 12000 }
        );
      });
    });
  }

  function readAndCompressImage(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          var canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = function () { reject(new Error("Falha ao carregar imagem")); };
        img.src = e.target.result;
      };
      reader.onerror = function () { reject(new Error("Falha ao ler arquivo")); };
      reader.readAsDataURL(file);
    });
  }

  function quickActionsHtml(gps, telefone) {
    var maps = gmapsUrl(gps);
    var wa = whatsappUrl(telefone);
    if (!maps && !wa) return "";
    var html = '<div class="btn-row quick-actions">';
    if (maps) html += '<a class="btn btn-maps" href="' + esc(maps) + '" target="_blank" rel="noopener">🗺️ Ver no Maps</a>';
    if (wa) html += '<a class="btn btn-whatsapp" href="' + esc(wa) + '" target="_blank" rel="noopener">💬 WhatsApp</a>';
    html += "</div>";
    return html;
  }

  function pad2(n) { return n < 10 ? "0" + n : String(n); }

  function gcalStamp(d) {
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
  }

  function gcalDateOnly(d) {
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
  }

  function gcalUrl(item) {
    if (!item.data) return null;
    var dates;
    if (item.hora) {
      var start = new Date(item.data + "T" + item.hora + ":00");
      var end = new Date(start.getTime() + 60 * 60 * 1000);
      dates = gcalStamp(start) + "/" + gcalStamp(end);
    } else {
      var startDay = new Date(item.data + "T00:00:00");
      var endDay = new Date(startDay.getTime() + 24 * 60 * 60 * 1000);
      dates = gcalDateOnly(startDay) + "/" + gcalDateOnly(endDay);
    }
    var params = [
      "action=TEMPLATE",
      "text=" + encodeURIComponent(item.titulo || "Compromisso"),
      "dates=" + dates,
      "details=" + encodeURIComponent(item.obs || "")
    ];
    return "https://calendar.google.com/calendar/render?" + params.join("&");
  }

    if (ui.tab === "consultores") return renderConsultores();

  // ---------- Painel ----------
  function startOfWeek(date) {
    var d = new Date(date);
    d.setHours(0, 0, 0, 0);
    var day = d.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }

  function endOfWeek(date) {
    var s = startOfWeek(date);
    var e = new Date(s);
    e.setDate(e.getDate() + 6);
    e.setHours(23, 59, 59, 999);
    return e;
  }

  function agendasDaSemana() {
    var start = startOfWeek(new Date());
    var end = endOfWeek(new Date());
    return state.agendas.filter(function (a) {
      if (a.concluido || !a.data) return false;
      var d = new Date(a.data + "T00:00:00");
      return d >= start && d <= end;
    });
  }

  function renderPainel() {
    var p = state.prospects;
    var totalArea = p.reduce(function (s, r) { return s + (toFloat(r.areaTotal) || 0); }, 0);
    var totalVolume = p.reduce(function (s, r) { return s + (toFloat(r.volume) || 0); }, 0);
    var prioridade1 = p.filter(function (r) { return r.prioridade === "1"; });
    var prioridade2 = p.filter(function (r) { return r.prioridade === "2"; });
    var agendaSemana = sortAgendas(agendasDaSemana());

    var filter = state.painelStatusFilter;
    var filteredCount = p.filter(function (r) { return filter.indexOf(r.status) !== -1; }).length;
    var subLabel = filter.length === STATUS_LIST.length ? "Todos os status" : (filter.length ? filter.join(", ") : "Nenhum status selecionado");

    var html = '';
    html += '<div class="stat-grid">';
    html += statCardAction("Clientes", filteredCount, subLabel);
    html += statCard("Consultores", state.consultores.length);
    html += statCard("Área total (ha)", fmtNum(totalArea));

      '<div class="value">' + esc(value) + "</div>" +
      '<div class="sub">' + esc(sub) + "</div>" +
      "</button>"

        "</label>";

    var checkboxes = el.sheetContent.querySelectorAll('input[type="checkbox"]');

  // ---------- Prospecções ----------
  function filteredProspects() {
    return state.prospects.filter(function (r) {
      if (ui.statusFilter !== "todos" && r.status !== ui.statusFilter) return false;
      if (!ui.search) return true;
      var hay = [r.fazenda, r.nomeContato, r.municipio, r.cultura, r.telefone].join(" ").toLowerCase();
      return hay.indexOf(ui.search) !== -1;
    });

  function emptyState(emoji, title, sub, actionLabel) {
    var html = '<div class="empty-state"><span class="emoji">' + emoji + "</span><p><strong>" + esc(title) + "</strong></p><p>" + esc(sub) + "</p>";

    return html;

    var btn = document.getElementById("emptyAddBtn");
    if (btn) btn.addEventListener("click", openAddForCurrentTab);
  }

  // ---------- Agenda ----------
  function findProspectById(id) {
    return state.prospects.find(function (p) { return p.id === id; });
  }

  function fmtAgendaDate(dateStr, timeStr) {
    if (!dateStr) return "";
    var parts = dateStr.split("-");
    var out = parts[2] + "/" + parts[1] + "/" + parts[0];
    if (timeStr) out += " às " + timeStr;
    return out;
  }

  function filteredAgendas() {
    return state.agendas.filter(function (a) {
      if (!ui.search) return true;
      var hay = [a.titulo, a.obs].join(" ").toLowerCase();
      return hay.indexOf(ui.search) !== -1;
    });
  }

  function sortAgendas(list) {
    return list.slice().sort(function (a, b) {
      var ka = (a.data || "9999") + "T" + (a.hora || "00:00");
      var kb = (b.data || "9999") + "T" + (b.hora || "00:00");
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
  }

  function renderAgendas() {
    var list = filteredAgendas();
    if (!list.length) {
      el.view.innerHTML = emptyState("🗓️", "Nenhum compromisso agendado", "Marque uma visita, ligação ou reunião.", "＋ Novo compromisso");
      bindEmptyStateButton();
      return;
    }
    var pending = sortAgendas(list.filter(function (a) { return !a.concluido; }));
    var done = sortAgendas(list.filter(function (a) { return a.concluido; }));

    var html = "";
    if (pending.length) {
      html += '<div class="card-list">' + pending.map(agendaCardHtml).join("") + "</div>";
    } else {
      html += emptyState("✅", "Nenhum compromisso pendente", "Tudo em dia por aqui.");
    }
    if (done.length) {
      html += '<div class="section-title">Concluídos</div>';
      html += '<div class="card-list">' + done.map(agendaCardHtml).join("") + "</div>";
    }
    el.view.innerHTML = html;
    bindAgendaCards();
  }

  function agendaCardHtml(item) {
    var rel = item.clienteId ? findProspectById(item.clienteId) : null;
    var meta = [];
    meta.push("🕒 " + esc(fmtAgendaDate(item.data, item.hora)));
    if (rel) meta.push(esc(rel.fazenda || rel.nomeContato));
    return (
      '<div class="agenda-card">' +
      '<button class="agenda-check' + (item.concluido ? " checked" : "") + '" data-id="' + item.id + '" aria-label="Marcar como concluído">' + (item.concluido ? "✓" : "") + "</button>" +
      '<button class="agenda-body" data-id="' + item.id + '">' +
      '<div class="agenda-title' + (item.concluido ? " done" : "") + '">' + esc(item.titulo || "(sem título)") + "</div>" +
      '<div class="meta">' + meta.map(function (m) { return "<span>" + m + "</span>"; }).join("") + "</div>" +
      "</button>" +
      "</div>"
    );
  }

  function bindAgendaCards() {
    Array.prototype.forEach.call(el.view.querySelectorAll(".agenda-check"), function (btn) {
      btn.addEventListener("click", function () {
        var item = state.agendas.find(function (a) { return a.id === btn.dataset.id; });
        if (!item) return;
        item.concluido = !item.concluido;
        saveState();
        renderAgendas();
      });
    });
    Array.prototype.forEach.call(el.view.querySelectorAll(".agenda-body"), function (btn) {
      btn.addEventListener("click", function () {
        var item = state.agendas.find(function (a) { return a.id === btn.dataset.id; });
        if (item) openAgendaDetail(item);
      });
    });

  function openAgendaDetail(item) {
    var rel = item.clienteId ? findProspectById(item.clienteId) : null;
    var telefone = item.telefone || (rel ? rel.telefone : "");
    var gps = item.gps || (rel ? rel.gps : "");
    var rows = [
      ["Data e hora", fmtAgendaDate(item.data, item.hora)],

      ["Telefone", telefone]
    ].filter(function (pair) { return pair[1]; });

    var html = '<div class="sheet-title">' + esc(item.titulo || "(sem título)") + "</div>";
    html += item.concluido
      ? '<span class="chip" style="background:var(--st-cliente-soft);color:var(--st-cliente)">Concluído</span>'
      : '<span class="chip" style="background:var(--accent-soft);color:var(--accent)">Pendente</span>';

    html += quickActionsHtml(gps, telefone);

    var cal = gcalUrl(item);
    if (cal) {
      html += '<div class="btn-row quick-actions"><a class="btn btn-maps" href="' + esc(cal) + '" target="_blank" rel="noopener">📅 Adicionar à agenda do celular</a></div>';
    }

    html += '<div class="detail-grid">' + rows.map(function (pair) {
      return '<div class="detail-row"><span class="k">' + esc(pair[0]) + '</span><span class="v">' + esc(pair[1]) + "</span></div>";

    html += '<div class="btn-row"><button class="btn btn-block" id="toggleDoneBtn">' + (item.concluido ? "Reabrir" : "Marcar como concluído") + '</button><button class="btn btn-primary btn-block" id="editBtn">Editar</button></div>';
    html += '<div class="btn-row"><button class="btn btn-danger btn-block" id="deleteBtn">Excluir compromisso</button></div>';

    el.sheetContent.innerHTML = html;
    document.getElementById("toggleDoneBtn").addEventListener("click", function () {

      closeSheet();
      renderAgendas();

      showConfirm("Excluir este compromisso? Essa ação não pode ser desfeita.", "Excluir", function () {
        state.agendas = state.agendas.filter(function (a) { return a.id !== item.id; });
        saveState();
        closeSheet();
        renderAgendas();
      });
    });

  }

  // ---------- Potencial do Cliente ----------
  function percentualCliente(cliente) {
    var pct = toFloat(cliente.percentualAtendimento);
    return isNaN(pct) ? 100 : Math.max(0, Math.min(100, pct));
  }

  function areaConsiderada(cliente) {
    var area = toFloat(cliente.areaTotal) || 0;
    return area * (percentualCliente(cliente) / 100);
  }

  function potencialPorProduto(cliente, produto) {
    return custoPorHa(produto) * areaConsiderada(cliente);
  }

  function potencialTotalCliente(cliente) {
    return state.produtos.reduce(function (sum, p) { return sum + potencialPorProduto(cliente, p); }, 0);
  }

  function filteredPotencialClientes() {
    return state.prospects.filter(function (r) {
      if (!ui.search) return true;
      var hay = [r.fazenda, r.nomeContato, r.municipio].join(" ").toLowerCase();
      return hay.indexOf(ui.search) !== -1;
    });
  }

  function renderPotencial() {
    if (!state.produtos.length) {
      el.view.innerHTML = emptyState("📦", "Cadastre produtos primeiro", "O potencial de compra é calculado a partir dos produtos cadastrados na aba Produtos.");
      return;
    }
    var list = filteredPotencialClientes();
    if (!list.length) {
      el.view.innerHTML = emptyState("📈", "Nenhum cliente encontrado", "Cadastre clientes na aba Clientes para ver o potencial de compra.");
      return;
    }
    var sorted = list.slice().sort(function (a, b) { return potencialTotalCliente(b) - potencialTotalCliente(a); });
    el.view.innerHTML = '<div class="card-list">' + sorted.map(potencialCardHtml).join("") + "</div>";
    bindPotencialCards();
  }

  function potencialCardHtml(r) {
    var total = potencialTotalCliente(r);
    var pct = percentualCliente(r);
    var areaConsid = areaConsiderada(r);
    return (
      '<button class="item-card" data-id="' + r.id + '">' +
      '<div class="stripe" style="background:var(--terra)"></div>' +
      '<div class="body">' +
      '<div class="top-line"><span class="name">' + esc(r.fazenda || r.nomeContato || "(sem nome)") + "</span>" +
      '<span class="chip" style="background:var(--terra-soft);color:var(--terra)">' + esc(fmtCurrency(total)) + "</span>" +
      "</div>" +
      '<div class="meta"><span>' + esc(fmtNum(areaConsid)) + " ha considerados</span><span>" + esc(pct) + "% da área</span></div>" +
      "</div></button>"
    );
  }

  function bindPotencialCards() {
    Array.prototype.forEach.call(el.view.querySelectorAll(".item-card[data-id]"), function (card) {
      card.addEventListener("click", function () {
        var rec = state.prospects.find(function (r) { return r.id === card.dataset.id; });
        if (rec) openPotencialDetail(rec);
      });

  var PCT_PRESETS = [25, 50, 75, 100];

  function openPotencialDetail(r) {
    var area = toFloat(r.areaTotal) || 0;
    var pct = percentualCliente(r);
    var areaConsid = areaConsiderada(r);
    var total = potencialTotalCliente(r);

    var html = '<div class="sheet-title">' + esc(r.fazenda || r.nomeContato || "(sem nome)") + "</div>";
    html += '<div class="about-block">Área total cadastrada: <strong>' + esc(fmtNum(area)) + " ha</strong></div>";
    if (!area) {
      html += '<div class="about-block" style="margin-top:6px;">Cadastre a área total deste cliente na aba Clientes para calcular o potencial.</div>';
    }

    html += '<div class="section-title" style="margin-top:16px;">Quanto da área pretende atender?</div>';
    html += '<div class="filter-row" style="padding:0;overflow:visible;">';
    PCT_PRESETS.forEach(function (p) {
      html += '<button class="filter-chip" data-pct="' + p + '" data-active="' + (pct === p) + '">' + p + "%</button>";
    });
    html += "</div>";
    html += '<div class="field" style="margin-top:10px;">' +
      '<label for="f_pctCustom">Ou digite uma porcentagem (%)</label>' +
      '<input id="f_pctCustom" type="text" inputmode="decimal" value="' + esc(pct) + '">' +
      "</div>";

    html += '<div class="stat-card" style="margin:14px 0;"><div class="label">Área considerada</div><div class="value">' + esc(fmtNum(areaConsid)) + " ha</div></div>";

    html += '<div class="detail-grid">' + potencialGridRows(r) + "</div>";
    html += '<div class="btn-row"><button class="btn btn-block" id="closeBtn">Fechar</button></div>';

    el.sheetContent.innerHTML = html;

    function applyPercent(newPct) {
      var clamped = Math.max(0, Math.min(100, toFloat(newPct)));
      if (isNaN(clamped)) return;
      r.percentualAtendimento = clamped;
      saveState();
      if (ui.tab === "potencial") renderPotencial();
      openPotencialDetail(r);
    }

    Array.prototype.forEach.call(el.sheetContent.querySelectorAll(".filter-chip"), function (chip) {
      chip.addEventListener("click", function () { applyPercent(parseFloat(chip.dataset.pct)); });
    });
    document.getElementById("f_pctCustom").addEventListener("change", function () {
      applyPercent(this.value);
    });
    document.getElementById("closeBtn").addEventListener("click", closeSheet);
    openSheet();
  }

  function potencialGridRows(r) {
    var total = potencialTotalCliente(r);
    var html = "";

    });
    html += '<div class="detail-row"><span class="k"><strong>Total</strong></span><span class="v"><strong>' + esc(fmtCurrency(total)) + "</strong></span></div>";
    return html;
  }

  // ----- Amostras -----
  function filteredAmostras() {
    return state.amostras.filter(function (a) {
      if (!ui.search) return true;
      var hay = [a.produtorFazenda, a.talhao].join(" ").toLowerCase();
      return hay.indexOf(ui.search) !== -1;

  function renderAmostras() {
    var target = document.getElementById("soloSubView");
    var list = filteredAmostras();
    if (!list.length) {
      target.innerHTML = emptyState("🧪", "Nenhuma amostra cadastrada", "Cadastre uma análise de solo para ver a interpretação automática.", "＋ Nova amostra");
      bindEmptyStateButton();
      return;
    }
    var sorted = list.slice().sort(function (a, b) { return (b.data || "").localeCompare(a.data || ""); });

  function amostraCardHtml(a) {
    var meta = [];
    if (a.talhao) meta.push(esc(a.talhao));
    if (a.data) meta.push(esc(fmtDateBR(a.data)));
    if (a.profundidade) meta.push(esc(a.profundidade));
    return (
      '<button class="item-card" data-id="' + a.id + '">' +
      '<div class="stripe" style="background:var(--accent)"></div>' +
      '<div class="body">' +
      '<div class="top-line"><span class="name">' + esc(a.produtorFazenda || "(sem nome)") + "</span></div>" +
      '<div class="meta">' + meta.map(function (m) { return "<span>" + m + "</span>"; }).join("") + "</div>" +
      "</div></button>"
    );
  }

  function bindAmostraCards() {
    Array.prototype.forEach.call(document.querySelectorAll("#soloSubView .item-card[data-id]"), function (card) {
      card.addEventListener("click", function () {
        var rec = state.amostras.find(function (a) { return a.id === card.dataset.id; });
        if (rec) openAmostraDetail(rec);
      });
    });
  }

  function paramCardHtml(p, sample) {
    var v = numOrNull(sample[p.key]);

    if (v === null) {
      return (
        '<div class="param-card">' +
        '<div class="param-top"><span class="param-nome">' + esc(p.nome) + '</span><span class="chip" style="background:var(--surface-2);color:var(--text-3)">Não informado</span></div>' +
        '<div class="param-faixa">Faixa ideal: ' + esc(faixa) + "</div>" +
        "</div>"
      );
    }
    var nivel = p.nivel(v, sample);
    var texto = p.texto(v, sample);
    var color = levelColor(nivel);
    return (
      '<div class="param-card">' +
      '<div class="param-top"><span class="param-nome">' + esc(p.nome) + '</span><span class="chip" style="background:' + color.bg + ";color:" + color.fg + '">' + esc(nivel) + "</span></div>" +
      '<div class="param-valor">' + esc(fmtNum(v)) + " " + esc(p.unidade) + "</div>" +
      '<div class="param-faixa">Faixa ideal: ' + esc(faixa) + "</div>" +
      (texto ? '<div class="param-texto">' + esc(texto) + "</div>" : "") +
      "</div>"
    );

  function openAmostraForm(rec) {
    ui.sheetMode = rec ? "edit-amostra" : "add-amostra";
    var r = rec || {};
    var html = '<div class="sheet-title">' + (rec ? "Editar amostra" : "Nova amostra") + "</div>";

      field({ name: "data", label: "Data da análise", type: "date", value: r.data }),

        html += fieldRow(campoA, campoB);
      }

    html += '<div class="about-block" style="margin-top:6px;">Deixe em branco os parâmetros que você não tiver — só os preenchidos entram na interpretação.</div>';

    el.sheetContent.innerHTML = html;
    document.getElementById("cancelBtn").addEventListener("click", closeSheet);

      var data = readForm(amostraFieldKeys());

        return;

      if (rec) {

      closeSheet();

        showConfirm("Excluir esta amostra? Essa ação não pode ser desfeita.", "Excluir", function () {

          saveState();
          closeSheet();
          render();
        });
      });
    }
    openSheet();
  }

  // ----- Adubação -----
  function calcField(name, label, value) {
    return '<div class="field"><label for="calc_' + name + '">' + esc(label) + '</label><input id="calc_' + name + '" data-calc="' + name + '" type="text" inputmode="decimal" value="' + esc(value || "") + '"></div>';
  }

  function calagemResultadoTexto(d) {
    var vDes = numOrNull(d.calagemVDesejado), vAtu = numOrNull(d.calagemVAtual), ctc = numOrNull(d.calagemCtc), prnt = numOrNull(d.calagemPrnt);
    if (vDes === null || vAtu === null || ctc === null || !prnt) return "—";
    var nc = ((vDes - vAtu) * ctc) / prnt;
    if (nc <= 0) return "0 t/ha — V% atual já atinge o desejado.";
    return fmtNum(nc) + " t/ha";
  }

  function gessoResultadoTexto(d) {
    var fator = numOrNull(d.gessoFator), argila = numOrNull(d.gessoArgila);
    if (fator === null || argila === null) return "—";
    return fmtNum(fator * argila) + " kg/ha";
  }

  function aduboResultadoHtml(d) {
    var pontos = numOrNull(d.aduboPontos), conc = numOrNull(d.aduboConcentracao), valorT = numOrNull(d.aduboValorTonelada);
    var kgHa = (pontos !== null && conc) ? pontos / (conc / 100) : null;
    var custoKg = valorT !== null ? valorT / 1000 : null;
    var custoTotal = (kgHa !== null && custoKg !== null) ? kgHa * custoKg : null;
    return (
      statCard("Produto (kg/ha)", kgHa !== null ? fmtNum(kgHa) : "—") +
      statCard("Custo por kg", custoKg !== null ? fmtCurrency(custoKg) : "—") +
      statCard("Custo total (R$/ha)", custoTotal !== null ? fmtCurrency(custoTotal) : "—")
    );
  }

  function updateAdubacaoResultados() {
    var d = state.adubacaoCalc;
    var calagemEl = document.getElementById("calagemResultado");
    if (calagemEl) calagemEl.querySelector(".value").textContent = calagemResultadoTexto(d);
    var gessoEl = document.getElementById("gessoResultado");
    if (gessoEl) gessoEl.querySelector(".value").textContent = gessoResultadoTexto(d);
    var aduboEl = document.getElementById("aduboResultado");
    if (aduboEl) aduboEl.innerHTML = aduboResultadoHtml(d);
  }

    html += '<div class="section-title" style="margin-top:22px;">Gessagem</div>';

      if (meta.length) html += '<div class="print-report-meta">' + meta.map(esc).join(" · ") + "</div>";
      html += printSecaoHtml("Observado", r.observado);
      html += printSecaoHtml("Leitura técnica (interpretação)", r.leituraTecnica);
      html += printSecaoHtml("Orientações", r.orientacoes);

      }
      html += "</div>";
    });

    html += '<div class="print-disclaimer">' + esc(RELATORIO_DISCLAIMER) + "</div>";

    return html;

  function exportarRelatoriosClientePdf(cliente) {
    var relatorios = state.relatorios
      .filter(function (r) { return r.clienteId === cliente.id; })
      .sort(function (a, b) { return (a.dataVisita || "").localeCompare(b.dataVisita || ""); });
    if (!relatorios.length) {
      showToast("Nenhum relatório de visita para este cliente.");
      return;
    }
    var printWindow = window.open("", "_blank");
    if (!printWindow) {
      showToast("Não foi possível abrir a janela de impressão. Verifique se o navegador bloqueou pop-ups.");
      return;
    }
    printWindow.document.open();
    printWindow.document.write(buildRelatoriosPrintHtml(cliente, relatorios));
    printWindow.document.close();
    setTimeout(function () {
      printWindow.focus();
      printWindow.print();
    }, 400);
  }

    return state.relatorios.filter(function (r) {
      if (!ui.search) return true;
      var hay = [r.titulo, r.observado].join(" ").toLowerCase();
      return hay.indexOf(ui.search) !== -1;
    });
  }

    var sorted = list.slice().sort(function (a, b) { return (b.dataVisita || "").localeCompare(a.dataVisita || ""); });

  function openRelatorioDetail(r) {

    }

  function openRelatorioForm(rec) {
    ui.sheetMode = rec ? "edit-relatorio" : "add-relatorio";
    var r = rec || {};
    var html = '<div class="sheet-title">' + (rec ? "Editar relatório" : "Novo relatório") + "</div>";

    html += field({ name: "titulo", label: "Título (ex.: Visita técnica — Fazenda X)", value: r.titulo });

      field({ name: "dataVisita", label: "Data da visita", type: "date", value: r.dataVisita }),

    );

    html += fieldRow(
      field({ name: "cultura", label: "Cultura", type: "list", options: CULTURAS, value: r.cultura }),
      field({ name: "estagioFenologico", label: "Estágio fenológico", value: r.estagioFenologico })
    );
    html += field({ name: "extensaoAvaliacao", label: "Talhões / extensão avaliada", value: r.extensaoAvaliacao });
    html += field({ name: "gps", label: "Coordenadas GPS do ponto avaliado", value: r.gps }) + gpsButtonHtml("f_gps");
    html += field({ name: "observado", label: "O que foi observado", type: "textarea", value: r.observado });
    html += field({ name: "leituraTecnica", label: "Leitura técnica (interpretação)", type: "textarea", value: r.leituraTecnica });
    html += field({ name: "orientacoes", label: "Orientações (e a condição de cada uma)", type: "textarea", value: r.orientacoes });
    html += field({ name: "limitacoes", label: "Limitações da avaliação", type: "textarea", value: r.limitacoes });
    html += field({ name: "pendenciasObs", label: "Pendências (responsável/prazo) e observações", type: "textarea", value: r.pendenciasObs });

    html += '<div class="field"><label>Fotos da visita</label>' +
      '<label class="btn btn-block" for="fotoInput" style="cursor:pointer;">📷 Adicionar fotos</label>' +
      '<input type="file" id="fotoInput" accept="image/*" multiple capture="environment" style="display:none;">' +
      '<div class="foto-grid" id="fotosGrid"></div>' +
      "</div>";

    html += '<div class="about-block" style="margin-top:6px;">Este relatório não substitui visita técnica, diagnóstico, análise laboratorial nem receituário — é um rascunho para sua revisão e assinatura profissional.</div>';
    html += '<div class="btn-row"><button class="btn btn-block" id="cancelBtn">Cancelar</button><button class="btn btn-primary btn-block" id="saveBtn">Salvar</button></div>';
    if (rec) html += '<div class="btn-row"><button class="btn btn-danger btn-block" id="deleteBtn">Excluir relatório</button></div>';

    el.sheetContent.innerHTML = html;
    bindGpsButtons(el.sheetContent);

    var fotos = (r.fotos || []).slice();
    function renderFotosGrid() {
      var grid = document.getElementById("fotosGrid");
      if (!grid) return;
      grid.innerHTML = fotos.map(function (f) {
        return '<div class="foto-thumb"><img src="' + f.dataUrl + '" alt=""><button type="button" class="foto-remove" data-foto-id="' + f.id + '">×</button></div>';
      }).join("");
      Array.prototype.forEach.call(grid.querySelectorAll(".foto-remove"), function (btn) {
        btn.addEventListener("click", function () {
          fotos = fotos.filter(function (f) { return f.id !== btn.dataset.fotoId; });
          renderFotosGrid();
        });
      });
    }
    renderFotosGrid();

    document.getElementById("fotoInput").addEventListener("change", function (e) {
      var files = Array.prototype.slice.call(e.target.files);
      if (!files.length) return;
      Promise.all(files.map(function (f) { return readAndCompressImage(f, 1000, 0.6); }))
        .then(function (dataUrls) {
          dataUrls.forEach(function (url) { fotos.push({ id: uid(), dataUrl: url }); });
          renderFotosGrid();
        })
        .catch(function () { showToast("Não foi possível processar uma das fotos."); });
      e.target.value = "";
    });

    document.getElementById("cancelBtn").addEventListener("click", closeSheet);
    document.getElementById("saveBtn").addEventListener("click", function () {
      var data = readForm(RELATORIO_FIELDS);
      if (!data.titulo) {
        showToast("Preencha ao menos o título do relatório.");
        return;
      }
      data.fotos = fotos;
      if (rec) {
        Object.assign(rec, data);
      } else {
        data.id = uid();
        state.relatorios.unshift(data);
      }
      saveState();
      closeSheet();
      render();
    });
    var delBtn = document.getElementById("deleteBtn");
    if (delBtn) {
      delBtn.addEventListener("click", function () {
        showConfirm("Excluir este relatório? Essa ação não pode ser desfeita.", "Excluir", function () {
          state.relatorios = state.relatorios.filter(function (r) { return r.id !== rec.id; });
          saveState();
          closeSheet();
          render();
        });
      });
    }
    openSheet();
  }

  // ---------- Field builder ----------
  function field(cfg) {
    var id = "f_" + cfg.name;
    var value = esc(cfg.value || "");
    var label = '<label for="' + id + '">' + esc(cfg.label) + "</label>";
    var input = "";
    if (cfg.type === "select") {
      input = '<select id="' + id + '" name="' + cfg.name + '">' +
        cfg.options.map(function (o) {
          return '<option value="' + esc(o) + '"' + (o === cfg.value ? " selected" : "") + ">" + esc(o) + "</option>";
        }).join("") + "</select>";
    } else if (cfg.type === "list") {
      var listId = id + "_list";
      input = '<input id="' + id + '" name="' + cfg.name + '" value="' + value + '" list="' + listId + '" autocomplete="off">' +
        '<datalist id="' + listId + '">' + cfg.options.map(function (o) { return '<option value="' + esc(o) + '">'; }).join("") + "</datalist>";
    } else if (cfg.type === "textarea") {
      input = '<textarea id="' + id + '" name="' + cfg.name + '">' + value + "</textarea>";
    } else {
      input = '<input id="' + id + '" name="' + cfg.name + '" type="' + (cfg.type || "text") + '" value="' + value + '"' + (cfg.inputmode ? ' inputmode="' + cfg.inputmode + '"' : "") + ">";
    }
    return '<div class="field">' + label + input + "</div>";
  }

  function fieldRow(a, b) {
    return '<div class="field-row">' + a + b + "</div>";
  }

  function readForm(names) {
    var out = {};
    names.forEach(function (n) {
      var elm = document.getElementById("f_" + n);
      out[n] = elm ? elm.value.trim() : "";
    });
    return out;
  }

      ["E-mail", r.email],
      ["Cultura", r.cultura]
    ].filter(function (pair) { return pair[1]; });

    var html = '<div class="sheet-title">' + esc(r.consultor || "(sem nome)") + "</div>";
    if (r.regiao) html += '<span class="chip" style="background:var(--accent-soft);color:var(--accent)">' + esc(r.regiao) + "</span>";
    html += quickActionsHtml(null, r.telefone);
    html += '<div class="detail-grid">' + rows.map(function (pair) {
      return '<div class="detail-row"><span class="k">' + esc(pair[0]) + '</span><span class="v">' + esc(pair[1]) + "</span></div>";
    }).join("") + "</div>";
    if (r.obs) html += '<div class="obs-block">' + esc(r.obs) + "</div>";
    html += '<div class="btn-row"><button class="btn btn-block" id="closeBtn">Fechar</button><button class="btn btn-primary btn-block" id="editBtn">Editar</button></div>';

    el.sheetContent.innerHTML = html;
    document.getElementById("closeBtn").addEventListener("click", closeSheet);
    document.getElementById("editBtn").addEventListener("click", function () { openConsultorForm(r); });
    openSheet();
  }

  // ---------- Consultor form ----------
  var CONSULTOR_FIELDS = ["regiao","consultor","municipio","estado","contato","telefone","email","cultura","obs"];

  function openConsultorForm(rec) {
    ui.sheetMode = rec ? "edit-consultor" : "add-consultor";
    var r = rec || {};
    var html = '<div class="sheet-title">' + (rec ? "Editar consultor" : "Novo consultor") + "</div>";
    html += fieldRow(
      field({ name: "consultor", label: "Nome do consultor", value: r.consultor }),
      field({ name: "regiao", label: "Região", value: r.regiao })
    );
    html += fieldRow(
      field({ name: "municipio", label: "Município", value: r.municipio }),
      field({ name: "estado", label: "Estado", type: "list", options: ["MATO GROSSO", "PARANÁ"], value: r.estado })
    );
    html += fieldRow(
      field({ name: "contato", label: "Pessoa de contato", value: r.contato }),
      field({ name: "telefone", label: "Telefone", type: "tel", inputmode: "tel", value: r.telefone })
    );
    html += fieldRow(
      field({ name: "email", label: "E-mail", type: "email", value: r.email }),
      field({ name: "cultura", label: "Cultura", type: "list", options: CULTURAS, value: r.cultura })
    );
    html += field({ name: "obs", label: "Observações", type: "textarea", value: r.obs });
    html += '<div class="btn-row"><button class="btn btn-block" id="cancelBtn">Cancelar</button><button class="btn btn-primary btn-block" id="saveBtn">Salvar</button></div>';
    if (rec) html += '<div class="btn-row"><button class="btn btn-danger btn-block" id="deleteBtn">Excluir consultor</button></div>';

    el.sheetContent.innerHTML = html;
    document.getElementById("cancelBtn").addEventListener("click", closeSheet);
    document.getElementById("saveBtn").addEventListener("click", function () {
      var data = readForm(CONSULTOR_FIELDS);
      if (!data.consultor) {
        showToast("Preencha ao menos o nome do consultor.");
        return;
      }
      if (rec) {
        Object.assign(rec, data);
      } else {
        data.id = uid();
        state.consultores.unshift(data);
      }
      saveState();
      closeSheet();
      render();
    });
    var delBtn = document.getElementById("deleteBtn");
    if (delBtn) {
      delBtn.addEventListener("click", function () {
        showConfirm("Excluir este consultor? Essa ação não pode ser desfeita.", "Excluir", function () {
          state.consultores = state.consultores.filter(function (c) { return c.id !== rec.id; });
          saveState();
          closeSheet();
          render();
        });
      });
    }
    openSheet();
  }

  // ---------- Menu (backup / ajuda) ----------
  function openMenuSheet() {
    ui.sheetMode = "menu";
    var html = '<div class="sheet-title">Backup e ajuda</div>';
    html += '<div class="about-block">';
    html += "<p>Todos os dados ficam salvos <strong>neste aparelho e neste navegador</strong>. Nada é enviado para a internet.</p>";
    html += "<p>Para não perder informação, ou para levar os dados para outro celular/computador, exporte um backup e depois importe nele.</p>";
    html += "</div>";
    html += '<div class="btn-row"><button class="btn btn-primary btn-block" id="exportBtn">Exportar backup (.json)</button></div>';
    html += '<div class="btn-row"><button class="btn btn-block" id="importBtn">Importar backup (.json)</button></div>';

    html += '<div class="section-title" style="margin-top:22px;">Exportar planilhas</div>';
    html += '<div class="about-block" style="margin-bottom:10px;">Gera um arquivo de texto com os dados separados por vírgula. Para abrir no Excel ou Google Planilhas: abra o programa e use "Arquivo → Abrir" (ou "Importar"), escolhendo o arquivo baixado.</div>';
    html += '<div class="btn-row"><button class="btn btn-block" id="exportClientesBtn">Clientes</button><button class="btn btn-block" id="exportAgendaBtn">Agenda</button></div>';
    html += '<div class="btn-row"><button class="btn btn-block" id="exportConsultoresBtn">Consultores</button></div>';

    html += '<div class="about-block" style="margin-top:18px;"><strong>Instalar como app no celular:</strong> abra este link no navegador do celular, toque no menu do navegador e escolha "Adicionar à tela de início".</div>';

    html += '<div class="section-title" style="margin-top:22px;">Suporte</div>';
    html += '<div class="about-block" style="margin-bottom:10px;">Ficou com alguma dúvida sobre o uso do app? Fale direto comigo:</div>';
    html += '<div class="detail-grid">';
    html += '<div class="detail-row"><span class="k">Nome</span><span class="v">Fellipe Eduardo Silva Vaz</span></div>';
    html += '<div class="detail-row"><span class="k">Telefone</span><span class="v">(34) 9 9709-4152</span></div>';
    html += '<div class="detail-row"><span class="k">E-mail</span><span class="v">fellipesilvavaz@gmail.com</span></div>';
    html += '</div>';
    html += '<div class="btn-row quick-actions">';
    html += '<a class="btn btn-whatsapp" href="' + esc(whatsappUrl("(34) 9 9709-4152")) + '" target="_blank" rel="noopener">💬 WhatsApp</a>';
    html += '<a class="btn btn-maps" href="mailto:fellipesilvavaz@gmail.com" target="_blank" rel="noopener">✉️ E-mail</a>';
    html += '</div>';

    html += '<div class="btn-row" style="margin-top:22px;"><button class="btn btn-block" id="closeMenuBtn">Fechar</button></div>';

    el.sheetContent.innerHTML = html;
    document.getElementById("closeMenuBtn").addEventListener("click", closeSheet);
    document.getElementById("exportBtn").addEventListener("click", exportBackup);
    document.getElementById("importBtn").addEventListener("click", function () { el.importInput.click(); });
    document.getElementById("exportClientesBtn").addEventListener("click", exportClientesCsv);
    document.getElementById("exportAgendaBtn").addEventListener("click", exportAgendaCsv);
    document.getElementById("exportConsultoresBtn").addEventListener("click", exportConsultoresCsv);
    openSheet();
  }

  function handleExportError(err) {
    if (err && err.code === "declined") return;
    if (err && err.code === "extension_not_enabled") {
      showToast("Exportação em CSV indisponível aqui. Use o backup em JSON.");
      return;
    }
    showToast("Não foi possível exportar agora.");
  }

  function exportBackup() {
    if (!window.claude || !window.claude.downloads) {
      showToast("Exportação indisponível neste momento.");
      return;
    }
    var payload = JSON.stringify(state, null, 2);
    var stamp = new Date().toISOString().slice(0, 10);
    window.claude.downloads.save({ filename: "backup-pipeline-agro-" + stamp + ".json", data: payload })
      .then(function () { closeSheet(); })
      .catch(handleExportError);
  }

  function csvEscape(v) {
    var s = v == null ? "" : String(v);
    if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function toCsv(headers, rows) {
    var lines = [headers.map(csvEscape).join(",")];
    rows.forEach(function (row) { lines.push(row.map(csvEscape).join(",")); });
    return "﻿" + lines.join("\r\n");
  }

  function exportClientesCsv() {
    if (!window.claude || !window.claude.downloads) {
      showToast("Exportação indisponível neste momento.");
      return;
    }
    var headers = ["Fazenda", "Município", "Estado", "Nome do Contato", "Cargo", "Telefone", "E-mail", "GPS", "Status", "Cultura", "Produto", "Mês previsto", "Área Total (ha)", "Área Irrigada (ha)", "Área Teste (ha)", "Volume Esperado (L)", "Prioridade", "Link", "Observações"];
    var rows = state.prospects.map(function (r) {
      return [r.fazenda, r.municipio, r.estado, r.nomeContato, r.cargoContato, r.telefone, r.email, r.gps, r.status, r.cultura, r.produto, r.mes, r.areaTotal, r.areaIrrigada, r.areaTeste, r.volume, r.prioridade, r.links, r.obs];
    });
    var stamp = new Date().toISOString().slice(0, 10);
    window.claude.downloads.save({ filename: "clientes-" + stamp + ".txt", data: toCsv(headers, rows) })
      .then(function () { closeSheet(); })
      .catch(handleExportError);
  }

  function exportAgendaCsv() {
    if (!window.claude || !window.claude.downloads) {
      showToast("Exportação indisponível neste momento.");
      return;
    }
    var headers = ["Título", "Data", "Hora", "Relacionado a", "Telefone", "Localização", "Status", "Observações"];
    var rows = state.agendas.map(function (a) {
      var rel = a.clienteId ? findProspectById(a.clienteId) : null;
      return [a.titulo, a.data, a.hora, rel ? (rel.fazenda || rel.nomeContato) : "", a.telefone, a.gps, a.concluido ? "Concluído" : "Pendente", a.obs];
    });
    var stamp = new Date().toISOString().slice(0, 10);
    window.claude.downloads.save({ filename: "agenda-" + stamp + ".txt", data: toCsv(headers, rows) })
      .then(function () { closeSheet(); })
      .catch(handleExportError);
  }

  function exportConsultoresCsv() {
    if (!window.claude || !window.claude.downloads) {
      showToast("Exportação indisponível neste momento.");
      return;
    }
    var headers = ["Consultor", "Região", "Município", "Estado", "Contato", "Telefone", "E-mail", "Cultura", "Observações"];
    var rows = state.consultores.map(function (c) {
      return [c.consultor, c.regiao, c.municipio, c.estado, c.contato, c.telefone, c.email, c.cultura, c.obs];
    });
    var stamp = new Date().toISOString().slice(0, 10);
    window.claude.downloads.save({ filename: "consultores-" + stamp + ".txt", data: toCsv(headers, rows) })
      .then(function () { closeSheet(); })
      .catch(handleExportError);
  }

  el.importInput.addEventListener("change", function () {
    var file = el.importInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.prospects) || !Array.isArray(data.consultores)) {
          throw new Error("formato inválido");
        }
        showConfirm("Importar este backup vai substituir os dados atuais deste aparelho. Continuar?", "Importar", function () {
          if (!Array.isArray(data.painelStatusFilter)) data.painelStatusFilter = STATUS_LIST.slice();
          if (!Array.isArray(data.agendas)) data.agendas = [];
          if (!Array.isArray(data.produtos)) data.produtos = [];
          if (!Array.isArray(data.amostras)) data.amostras = [];
          if (!data.adubacaoCalc || typeof data.adubacaoCalc !== "object") data.adubacaoCalc = {};
          if (!Array.isArray(data.relatorios)) data.relatorios = [];
          state = data;
          saveState();
          closeSheet();
          render();
        });
      } catch (e) {
        showToast("Este arquivo não é um backup válido.");
      }
    };
    reader.readAsText(file);
    el.importInput.value = "";
  });

  render();
})();
</script>
